<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8FBF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8E8E0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F9F8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Fragmented cards (top, scattered) -->
  <g>
    <!-- Card 1 - Booking -->
    <rect x="80" y="80" width="140" height="100" rx="8" fill="url(#cardGradient)" stroke="#4A90E2" stroke-width="2.5" opacity="0.9"/>
    <rect x="95" y="95" width="110" height="8" rx="4" fill="#4A90E2" opacity="0.7"/>
    <rect x="95" y="110" width="80" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <rect x="95" y="122" width="60" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <circle cx="200" cy="100" r="5" fill="#4A90E2" opacity="0.7"/>
    
    <!-- Card 2 - Itinerary -->
    <rect x="280" y="60" width="140" height="100" rx="8" fill="url(#cardGradient)" stroke="#4A90E2" stroke-width="2.5" opacity="0.9"/>
    <rect x="295" y="75" width="110" height="8" rx="4" fill="#4A90E2" opacity="0.7"/>
    <rect x="295" y="90" width="90" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <rect x="295" y="102" width="70" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <circle cx="400" cy="80" r="5" fill="#4A90E2" opacity="0.7"/>
    
    <!-- Card 3 - Discovery -->
    <rect x="500" y="100" width="140" height="100" rx="8" fill="url(#cardGradient)" stroke="#4A90E2" stroke-width="2.5" opacity="0.9"/>
    <rect x="515" y="115" width="110" height="8" rx="4" fill="#4A90E2" opacity="0.7"/>
    <rect x="515" y="130" width="85" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <rect x="515" y="142" width="65" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <circle cx="620" cy="120" r="5" fill="#4A90E2" opacity="0.7"/>
    
    <!-- Card 4 - Maps -->
    <rect x="180" y="220" width="140" height="100" rx="8" fill="url(#cardGradient)" stroke="#4A90E2" stroke-width="2.5" opacity="0.9"/>
    <rect x="195" y="235" width="110" height="8" rx="4" fill="#4A90E2" opacity="0.7"/>
    <rect x="195" y="250" width="95" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <rect x="195" y="262" width="75" height="6" rx="3" fill="#5A6C7D" opacity="0.5"/>
    <circle cx="300" cy="240" r="5" fill="#4A90E2" opacity="0.7"/>
  </g>
  
  <!-- Connection lines (dashed, showing fragmentation) -->
  <g stroke="#5A6C7D" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.6">
    <line x1="150" y1="130" x2="350" y2="110"/>
    <line x1="350" y1="110" x2="570" y2="150"/>
    <line x1="250" y1="180" x2="250" y2="270"/>
  </g>
  
  <!-- Unified platform (bottom center, larger) -->
  <g>
    <!-- Main unified card -->
    <rect x="250" y="360" width="300" height="180" rx="12" fill="url(#cardGradient)" stroke="#4A90E2" stroke-width="4"/>
    
    <!-- Unified header -->
    <rect x="270" y="380" width="260" height="12" rx="6" fill="#4A90E2" opacity="0.8"/>
    
    <!-- Unified content sections -->
    <rect x="270" y="405" width="120" height="8" rx="4" fill="#4A90E2" opacity="0.6"/>
    <rect x="270" y="420" width="100" height="6" rx="3" fill="#5A6C7D" opacity="0.6"/>
    
    <rect x="410" y="405" width="120" height="8" rx="4" fill="#4A90E2" opacity="0.6"/>
    <rect x="410" y="420" width="100" height="6" rx="3" fill="#5A6C7D" opacity="0.6"/>
    
    <rect x="270" y="445" width="260" height="8" rx="4" fill="#4A90E2" opacity="0.6"/>
    <rect x="270" y="460" width="200" height="6" rx="3" fill="#5A6C7D" opacity="0.6"/>
    <rect x="270" y="472" width="180" height="6" rx="3" fill="#5A6C7D" opacity="0.6"/>
    
    <!-- Integration indicator (small connecting nodes) -->
    <circle cx="400" cy="500" r="7" fill="#4A90E2" opacity="0.8"/>
    <circle cx="380" cy="510" r="5" fill="#4A90E2" opacity="0.6"/>
    <circle cx="420" cy="510" r="5" fill="#4A90E2" opacity="0.6"/>
    
    <!-- Connection arrows pointing to unified platform -->
    <g stroke="#4A90E2" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M 150 180 Q 200 270 250 360" stroke-dasharray="4,4"/>
      <path d="M 350 160 Q 350 260 400 360" stroke-dasharray="4,4"/>
      <path d="M 570 200 Q 500 280 450 360" stroke-dasharray="4,4"/>
      <path d="M 250 270 Q 250 315 250 360" stroke-dasharray="4,4"/>
    </g>
    
    <!-- Arrow heads -->
    <g fill="#4A90E2" opacity="0.7">
      <polygon points="250,360 245,355 245,365"/>
      <polygon points="400,360 395,355 395,365"/>
      <polygon points="450,360 445,355 445,365"/>
      <polygon points="250,360 245,355 245,365"/>
    </g>
  </g>
  
  <!-- Subtle accent elements -->
  <circle cx="100" cy="500" r="40" fill="#B0E5DF" opacity="0.3"/>
  <circle cx="700" cy="100" r="50" fill="#B0E5DF" opacity="0.25"/>
</svg>

