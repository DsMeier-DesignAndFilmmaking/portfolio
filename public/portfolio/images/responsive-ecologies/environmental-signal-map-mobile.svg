<svg xmlns="http://www.w3.org/2000/svg" width="390" height="860" viewBox="0 0 390 860" role="img" aria-labelledby="environmental-signal-map-mobile-title environmental-signal-map-mobile-desc">
  <title id="environmental-signal-map-mobile-title">Mobile Environmental Signal Map for Responsive Ecologies</title>
  <desc id="environmental-signal-map-mobile-desc">A vertical systems diagram showing environmental signals flowing through ecological conditions, visitor and social signals, operational capacity, stewardship decisions, and monitoring and learning.</desc>
  <defs>
    <style>
      .label{font:700 9px/1 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;letter-spacing:.15em;text-transform:uppercase}
      .title{font:700 22px/1.12 Georgia,"Times New Roman",serif}
      .nodeTitle{font:700 18px/1.15 Georgia,"Times New Roman",serif}
      .body{font:500 12.5px/1.35 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
      .small{font:700 9px/1 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase}
    </style>
    <marker id="mobile-arrow-neutral" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4 0 8Z" fill="#64748B"/>
    </marker>
    <marker id="mobile-arrow-emerald" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4 0 8Z" fill="#047857"/>
    </marker>
  </defs>

  <rect width="390" height="860" fill="#FFFFFF"/>

  <g id="mobile-header">
    <text x="32" y="44" class="label" fill="#047857">Responsive Ecologies</text>
    <text x="32" y="78" class="title" fill="#0F172A">Environmental Signal Map</text>
    <text x="32" y="108" class="body" fill="#475569">
      <tspan x="32" dy="0">Signals become useful when conditions,</tspan>
      <tspan x="32" dy="17">capacity, and learning stay connected.</tspan>
    </text>
  </g>

  <g id="mobile-flow" aria-label="Vertical environmental signal flow">
    <g id="mobile-environmental-signals">
      <rect x="32" y="148" width="326" height="88" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="70" cy="192" r="18" fill="#ECFEFF" stroke="#A5F3FC"/>
      <path d="M64 192a6 6 0 1 0 12 0 6 6 0 0 0-12 0Zm15 0h9M52 192h9M70 174v9M70 201v9M59 181l7 7M81 203l7 7M81 181l-7 7M59 203l7-7" fill="none" stroke="#0E7490" stroke-width="1.6" stroke-linecap="round"/>
      <text x="106" y="178" class="small" fill="#0E7490">Environmental Signals</text>
      <text x="106" y="205" class="nodeTitle" fill="#0F172A">Climate, water, soil</text>
      <text x="106" y="224" class="body" fill="#475569">Disturbance patterns and exposure</text>
    </g>

    <path d="M195 236v34" fill="none" stroke="#64748B" stroke-width="1.35" marker-end="url(#mobile-arrow-neutral)"/>

    <g id="mobile-ecological-conditions">
      <rect x="32" y="270" width="326" height="88" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="70" cy="314" r="18" fill="#ECFDF5" stroke="#BBF7D0"/>
      <path d="M70 329v-24M70 305c-10-7-12-14-7-20 10 2 14 8 7 20Zm0 0c10-7 12-14 7-20-10 2-14 8-7 20Z" fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="300" class="small" fill="#047857">Ecological Conditions</text>
      <text x="106" y="327" class="nodeTitle" fill="#0F172A">Habitat quality</text>
      <text x="106" y="346" class="body" fill="#475569">Vegetation health and biodiversity</text>
    </g>

    <path d="M195 358v34" fill="none" stroke="#64748B" stroke-width="1.35" marker-end="url(#mobile-arrow-neutral)"/>

    <g id="mobile-visitor-social-signals">
      <rect x="32" y="392" width="326" height="88" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="70" cy="436" r="18" fill="#FFF7ED" stroke="#FED7AA"/>
      <path d="M70 433a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm-15 20c2-10 8-15 15-15s13 5 15 15" fill="none" stroke="#C2410C" stroke-width="1.6" stroke-linecap="round"/>
      <text x="106" y="422" class="small" fill="#C2410C">Visitor &amp; Social Signals</text>
      <text x="106" y="449" class="nodeTitle" fill="#0F172A">Use and meaning</text>
      <text x="106" y="468" class="body" fill="#475569">Visitation, sense of place, compliance</text>
    </g>

    <path d="M195 480v34" fill="none" stroke="#64748B" stroke-width="1.35" marker-end="url(#mobile-arrow-neutral)"/>

    <g id="mobile-operational-capacity">
      <rect x="32" y="514" width="326" height="88" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="70" cy="558" r="18" fill="#EFF6FF" stroke="#BFDBFE"/>
      <path d="M58 568h24M60 556h20M64 544h12M58 568l7-24h10l7 24" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="544" class="small" fill="#1D4ED8">Operational Capacity</text>
      <text x="106" y="571" class="nodeTitle" fill="#0F172A">Readiness to act</text>
      <text x="106" y="590" class="body" fill="#475569">Funding, coverage, staff readiness</text>
    </g>

    <path d="M195 602v34" fill="none" stroke="#64748B" stroke-width="1.35" marker-end="url(#mobile-arrow-neutral)"/>

    <g id="mobile-stewardship-decisions">
      <rect x="32" y="636" width="326" height="88" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.4"/>
      <circle cx="70" cy="680" r="18" fill="#D1FAE5" stroke="#6EE7B7"/>
      <path d="M58 681l8 8 18-21" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="666" class="small" fill="#047857">Stewardship Decisions</text>
      <text x="106" y="693" class="nodeTitle" fill="#0F172A">Prioritize and adapt</text>
      <text x="106" y="712" class="body" fill="#475569">Intervene, recover, adapt</text>
    </g>

    <path d="M195 724v34" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#mobile-arrow-emerald)"/>

    <g id="mobile-monitoring-learning">
      <rect x="32" y="758" width="326" height="72" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="70" cy="794" r="16" fill="#F0FDF4" stroke="#BBF7D0"/>
      <path d="M61 794a9 9 0 0 1 15-7l3 3M79 786v4h-4M79 794a9 9 0 0 1-15 7l-3-3M61 802v-4h4" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="786" class="small" fill="#047857">Monitoring &amp; Learning</text>
      <text x="106" y="812" class="body" fill="#475569">Track outcomes and update thresholds</text>
    </g>

    <path d="M46 794H22c-8 0-14-6-14-14V170c0-8 6-14 14-14h10" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#mobile-arrow-neutral)"/>
  </g>
</svg>
