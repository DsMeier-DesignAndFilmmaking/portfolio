<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 940" width="1220" height="940" role="img" aria-labelledby="esm-title esm-desc">
  <title id="esm-title">Ecological Stewardship Systems Map</title>
  <desc id="esm-desc">A systems diagram showing four interconnected feedback loops: Small Water Cycle, Soil Carbon Cycle, Visitor Stewardship Loop, and Adaptive Management Loop, connecting 23 nodes across five ecological zones.</desc>
  <defs>
    <style>
      .esm-zone-lbl { font: 700 8.5px/1 -apple-system,'Inter',sans-serif; fill:#94A3B8; letter-spacing:.07em; }
      .esm-node-lbl { font: 500 10.5px/1 -apple-system,'Inter',sans-serif; fill:#1E293B; letter-spacing:.003em; }
      .esm-badge-t  { font: 700 9.5px/1 -apple-system,'Inter',sans-serif; letter-spacing:.01em; }
      .esm-badge-s  { font: 400 8.5px/1 -apple-system,'Inter',sans-serif; letter-spacing:.005em; }
      .esm-leg-lbl  { font: 500 9px/1 -apple-system,'Inter',sans-serif; fill:#374151; }
      .esm-leg-hdg  { font: 700 7.5px/1 -apple-system,'Inter',sans-serif; fill:#94A3B8; letter-spacing:.06em; }
    </style>
    <marker id="arr-gray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arr-earth" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#7C5C2E"/>
    </marker>
    <marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#059669"/>
    </marker>
    <marker id="arr-amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0 10 3.5 0 7" fill="#7C3AED"/>
