<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8FBF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0F0ED;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8E6E0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A0DCD4;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#26C6DA;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0.3" />
    </linearGradient>
    
    <radialGradient id="nodeGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#26C6DA;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Filters for subtle effects -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="url(#skyGradient)"/>
  
  <!-- Abstract cityscape silhouette (bottom) -->
  <g opacity="0.15">
    <!-- Building 1 -->
    <rect x="100" y="650" width="80" height="200" fill="url(#buildingGradient)" rx="4"/>
    <rect x="120" y="600" width="40" height="50" fill="url(#buildingGradient)" rx="2"/>
    
    <!-- Building 2 -->
    <rect x="220" y="700" width="100" height="150" fill="url(#buildingGradient)" rx="4"/>
    <rect x="240" y="650" width="60" height="50" fill="url(#buildingGradient)" rx="2"/>
    
    <!-- Building 3 -->
    <rect x="360" y="680" width="90" height="170" fill="url(#buildingGradient)" rx="4"/>
    
    <!-- Building 4 -->
    <rect x="500" y="720" width="70" height="130" fill="url(#buildingGradient)" rx="4"/>
    <rect x="515" y="680" width="40" height="40" fill="url(#buildingGradient)" rx="2"/>
    
    <!-- Building 5 -->
    <rect x="620" y="650" width="85" height="200" fill="url(#buildingGradient)" rx="4"/>
    
    <!-- Building 6 -->
    <rect x="750" y="700" width="95" height="150" fill="url(#buildingGradient)" rx="4"/>
    <rect x="770" y="660" width="55" height="40" fill="url(#buildingGradient)" rx="2"/>
    
    <!-- Building 7 -->
    <rect x="890" y="680" width="80" height="170" fill="url(#buildingGradient)" rx="4"/>
    
    <!-- Building 8 -->
    <rect x="1010" y="720" width="70" height="130" fill="url(#buildingGradient)" rx="4"/>
  </g>
  
  <!-- Neural network / AI connection lines (subtle) -->
  <g opacity="0.25" stroke="#4FC3F7" stroke-width="1.5" fill="none" stroke-dasharray="4,4">
    <path d="M 200 300 Q 300 250 400 280 T 600 300" />
    <path d="M 250 350 Q 350 300 450 330 T 650 350" />
    <path d="M 300 400 Q 400 350 500 380 T 700 400" />
    <path d="M 500 280 Q 600 250 700 280 T 900 300" />
    <path d="M 550 330 Q 650 300 750 330 T 950 350" />
  </g>
  
  <!-- AI Nodes / Connection points -->
  <g opacity="0.4">
    <circle cx="200" cy="300" r="8" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="400" cy="280" r="6" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="600" cy="300" r="8" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="250" cy="350" r="6" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="450" cy="330" r="7" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="650" cy="350" r="6" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="700" cy="280" r="8" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
    <circle cx="900" cy="300" r="7" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
  </g>
  
  <!-- Travel path / Journey line (curved, dynamic) -->
  <g opacity="0.4">
    <path d="M 150 500 Q 300 400 450 450 T 750 500 T 1050 480" 
          stroke="url(#pathGradient)" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Waypoints along the path -->
    <circle cx="150" cy="500" r="12" fill="#4FC3F7" opacity="0.6"/>
    <circle cx="450" cy="450" r="14" fill="#26C6DA" opacity="0.7"/>
    <circle cx="750" cy="500" r="12" fill="#00BCD4" opacity="0.6"/>
    <circle cx="1050" cy="480" r="10" fill="#4FC3F7" opacity="0.5"/>
    
    <!-- Small dots along path -->
    <circle cx="300" cy="425" r="4" fill="#4FC3F7" opacity="0.5"/>
    <circle cx="600" cy="475" r="4" fill="#26C6DA" opacity="0.5"/>
    <circle cx="900" cy="490" r="4" fill="#00BCD4" opacity="0.5"/>
  </g>
  
  <!-- Compass icon (top right, subtle) -->
  <g transform="translate(1000, 150)" opacity="0.2">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#4FC3F7" stroke-width="1.5"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#4FC3F7" stroke-width="1.5"/>
    <polygon points="0,-45 5,0 0,5 -5,0" fill="#26C6DA"/>
    <polygon points="0,45 -5,0 0,-5 5,0" fill="#4FC3F7"/>
  </g>
  
  <!-- Abstract map grid (very subtle) -->
  <g opacity="0.08" stroke="#4FC3F7" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    
    <!-- Vertical lines -->
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>
  
  <!-- Floating location markers (spontaneous discovery points) -->
  <g opacity="0.3">
    <!-- Marker 1 -->
    <g transform="translate(350, 200)">
      <path d="M 0,-15 L 8,8 L 0,5 L -8,8 Z" fill="#4FC3F7"/>
      <circle cx="0" cy="-15" r="6" fill="#26C6DA" opacity="0.6"/>
    </g>
    
    <!-- Marker 2 -->
    <g transform="translate(650, 180)">
      <path d="M 0,-15 L 8,8 L 0,5 L -8,8 Z" fill="#26C6DA"/>
      <circle cx="0" cy="-15" r="5" fill="#4FC3F7" opacity="0.6"/>
    </g>
    
    <!-- Marker 3 -->
    <g transform="translate(850, 220)">
      <path d="M 0,-15 L 8,8 L 0,5 L -8,8 Z" fill="#00BCD4"/>
      <circle cx="0" cy="-15" r="6" fill="#4FC3F7" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Abstract waves / movement (bottom, very subtle) -->
  <g opacity="0.1">
    <path d="M 0,850 Q 300,830 600,850 T 1200,850" 
          stroke="#4FC3F7" 
          stroke-width="2" 
          fill="none"/>
    <path d="M 0,880 Q 300,860 600,880 T 1200,880" 
          stroke="#26C6DA" 
          stroke-width="2" 
          fill="none"/>
  </g>
</svg>

