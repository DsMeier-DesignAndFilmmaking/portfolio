<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Glow overlay -->
  <rect width="1920" height="1080" fill="url(#glowGradient)"/>
  
  <!-- Abstract AI/Tech elements -->
  <g opacity="0.6">
    <!-- Circuit-like patterns -->
    <path d="M100 200 L300 200 L300 300 L500 300 L500 400 L700 400" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M1500 600 L1700 600 L1700 500 L1500 500 L1500 400 L1300 400" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M800 800 L1000 800 L1000 700 L1200 700 L1200 600 L1400 600" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Floating geometric shapes -->
    <circle cx="400" cy="300" r="20" fill="url(#circleGradient)"/>
    <circle cx="1200" cy="400" r="15" fill="url(#circleGradient)"/>
    <circle cx="800" cy="600" r="25" fill="url(#circleGradient)"/>
    <circle cx="1600" cy="700" r="18" fill="url(#circleGradient)"/>
    
    <!-- AI brain/network nodes -->
    <g transform="translate(300, 500)">
      <circle cx="0" cy="0" r="8" fill="#3b82f6" opacity="0.6"/>
      <circle cx="60" cy="-30" r="6" fill="#8b5cf6" opacity="0.6"/>
      <circle cx="60" cy="30" r="6" fill="#06b6d4" opacity="0.6"/>
      <circle cx="120" cy="0" r="8" fill="#3b82f6" opacity="0.6"/>
      <line x1="0" y1="0" x2="60" y2="-30" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="60" y2="30" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="60" y1="-30" x2="120" y2="0" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
      <line x1="60" y1="30" x2="120" y2="0" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    </g>
    
    <g transform="translate(1400, 300)">
      <circle cx="0" cy="0" r="8" fill="#8b5cf6" opacity="0.6"/>
      <circle cx="50" cy="-25" r="6" fill="#3b82f6" opacity="0.6"/>
      <circle cx="50" cy="25" r="6" fill="#06b6d4" opacity="0.6"/>
      <circle cx="100" cy="0" r="8" fill="#8b5cf6" opacity="0.6"/>
      <line x1="0" y1="0" x2="50" y2="-25" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="50" y2="25" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
      <line x1="50" y1="-25" x2="100" y2="0" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="50" y1="25" x2="100" y2="0" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Travel elements -->
  <g opacity="0.4">
    <!-- World map outline -->
    <path d="M1600 200 Q1650 180 1700 200 Q1750 220 1800 200 Q1850 180 1900 200 L1900 300 Q1850 320 1800 300 Q1750 280 1700 300 Q1650 320 1600 300 Z" fill="none" stroke="#06b6d4" stroke-width="1"/>
    
    <!-- Airplane silhouette -->
    <g transform="translate(200, 800)">
      <path d="M0 0 L40 -10 L80 0 L40 10 Z" fill="#3b82f6" opacity="0.7"/>
      <path d="M20 -5 L20 5" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
    </g>
    
    <!-- Compass -->
    <g transform="translate(1700, 800)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
      <path d="M0 -25 L0 25 M-25 0 L25 0" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
      <path d="M0 -20 L-5 -5 L0 0 L5 -5 Z" fill="#3b82f6" opacity="0.7"/>
    </g>
    
    <!-- Location pins -->
    <g transform="translate(400, 700)">
      <circle cx="0" cy="0" r="3" fill="#8b5cf6" opacity="0.8"/>
      <path d="M0 0 L0 15 L-5 20 L0 15 L5 20 Z" fill="#8b5cf6" opacity="0.8"/>
    </g>
    
    <g transform="translate(1200, 500)">
      <circle cx="0" cy="0" r="3" fill="#3b82f6" opacity="0.8"/>
      <path d="M0 0 L0 15 L-5 20 L0 15 L5 20 Z" fill="#3b82f6" opacity="0.8"/>
    </g>
    
    <g transform="translate(900, 900)">
      <circle cx="0" cy="0" r="3" fill="#06b6d4" opacity="0.8"/>
      <path d="M0 0 L0 15 L-5 20 L0 15 L5 20 Z" fill="#06b6d4" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Data visualization elements -->
  <g opacity="0.3">
    <!-- Bar chart -->
    <g transform="translate(100, 900)">
      <rect x="0" y="0" width="8" height="40" fill="#3b82f6"/>
      <rect x="12" y="0" width="8" height="60" fill="#8b5cf6"/>
      <rect x="24" y="0" width="8" height="30" fill="#06b6d4"/>
      <rect x="36" y="0" width="8" height="50" fill="#3b82f6"/>
      <rect x="48" y="0" width="8" height="35" fill="#8b5cf6"/>
    </g>
    
    <!-- Line graph -->
    <g transform="translate(1600, 100)">
      <path d="M0 50 L20 30 L40 40 L60 20 L80 10 L100 25" stroke="#06b6d4" stroke-width="2" fill="none"/>
      <circle cx="0" cy="50" r="3" fill="#06b6d4"/>
      <circle cx="20" cy="30" r="3" fill="#06b6d4"/>
      <circle cx="40" cy="40" r="3" fill="#06b6d4"/>
      <circle cx="60" cy="20" r="3" fill="#06b6d4"/>
      <circle cx="80" cy="10" r="3" fill="#06b6d4"/>
      <circle cx="100" cy="25" r="3" fill="#06b6d4"/>
    </g>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="150" cy="150" r="2" fill="#3b82f6"/>
    <circle cx="300" cy="250" r="1.5" fill="#8b5cf6"/>
    <circle cx="450" cy="180" r="2" fill="#06b6d4"/>
    <circle cx="600" cy="320" r="1" fill="#3b82f6"/>
    <circle cx="750" cy="200" r="1.5" fill="#8b5cf6"/>
    <circle cx="900" cy="280" r="2" fill="#06b6d4"/>
    <circle cx="1050" cy="150" r="1" fill="#3b82f6"/>
    <circle cx="1200" cy="220" r="1.5" fill="#8b5cf6"/>
    <circle cx="1350" cy="350" r="2" fill="#06b6d4"/>
    <circle cx="1500" cy="180" r="1" fill="#3b82f6"/>
    <circle cx="1650" cy="300" r="1.5" fill="#8b5cf6"/>
    <circle cx="1800" cy="250" r="2" fill="#06b6d4"/>
  </g>
</svg> 