<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <!-- Neural network pattern -->
    <pattern id="neural" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="2" fill="#4a90e2" opacity="0.3"/>
      <line x1="0" y1="50" x2="100" y2="50" stroke="#4a90e2" stroke-width="0.5" opacity="0.2"/>
      <line x1="50" y1="0" x2="50" y2="100" stroke="#4a90e2" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grad)"/>
  <rect width="1200" height="800" fill="url(#neural)"/>
  
  <!-- AI Text -->
  <text x="600" y="350" font-family="Arial" font-size="120" font-weight="bold" fill="white" text-anchor="middle">AI</text>
  <text x="600" y="450" font-family="Arial" font-size="80" font-weight="bold" fill="#4a90e2" text-anchor="middle">Fun</text>
  
  <!-- Decorative elements -->
  <circle cx="300" cy="200" r="50" fill="#4a90e2" opacity="0.1"/>
  <circle cx="900" cy="600" r="70" fill="#4a90e2" opacity="0.1"/>
  <circle cx="600" cy="150" r="30" fill="#4a90e2" opacity="0.1"/>
  <circle cx="400" cy="650" r="40" fill="#4a90e2" opacity="0.1"/>
</svg> 